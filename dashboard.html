<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ Tagesaufgaben Dashboard</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // SVG Icons als Komponenten
        const Clock = ({ size = 24, className = "" }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <circle cx="12" cy="12" r="10"/>
                <polyline points="12 6 12 12 16 14"/>
            </svg>
        );

        const Trophy = ({ size = 24, className = "" }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/>
                <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/>
                <path d="M4 22h16"/>
                <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/>
                <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/>
                <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>
            </svg>
        );

        const CheckCircle2 = ({ size = 24, className = "" }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <circle cx="12" cy="12" r="10"/>
                <path d="m9 12 2 2 4-4"/>
            </svg>
        );

        const Play = ({ size = 24, className = "" }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <polygon points="5 3 19 12 5 21 5 3"/>
            </svg>
        );

        const Pause = ({ size = 24, className = "" }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <rect x="6" y="4" width="4" height="16"/>
                <rect x="14" y="4" width="4" height="16"/>
            </svg>
        );

        const RotateCcw = ({ size = 24, className = "" }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                <path d="M3 3v5h5"/>
            </svg>
        );

        const Gamepad2 = ({ size = 24, className = "" }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <line x1="6" y1="11" x2="10" y2="11"/>
                <line x1="8" y1="9" x2="8" y2="13"/>
                <line x1="15" y1="12" x2="15.01" y2="12"/>
                <line x1="18" y1="10" x2="18.01" y2="10"/>
                <path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"/>
            </svg>
        );

        const Calendar = ({ size = 24, className = "" }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
        );

        const XCircle = ({ size = 24, className = "" }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="15" y1="9" x2="9" y2="15"/>
                <line x1="9" y1="9" x2="15" y2="15"/>
            </svg>
        );

        function TaskDashboard() {
            const [tasks, setTasks] = useState([
                { id: 1, name: 'Zimmer aufräumen', type: 'checkbox', completed: false, points: 1 },
                { id: 2, name: 'Bett machen', type: 'checkbox', completed: false, points: 1 },
                { id: 3, name: 'Schulranzen packen', type: 'checkbox', completed: false, points: 1 },
                { id: 4, name: 'Lernen', type: 'optional', completed: false, skipped: false, points: 1 },
                { id: 5, name: 'Hausaufgaben machen', type: 'optional', completed: false, skipped: false, points: 1 },
                { id: 6, name: 'Klavier üben', type: 'timed', completed: false, timeSpent: 0, points: 0 },
                { id: 7, name: 'Lesen', type: 'timed', completed: false, timeSpent: 0, points: 0 },
                { id: 8, name: 'Wasser trinken', type: 'multi', completed: 0, maxPerDay: 10, pointsEach: 0.5 },
                { id: 9, name: 'Klamotten aufheben', type: 'multi', completed: 0, maxPerDay: 2, pointsEach: 0.5 }
            ]);

            const [activeTaskId, setActiveTaskId] = useState(null);
            const [currentTime, setCurrentTime] = useState(0);
            const [isRunning, setIsRunning] = useState(false);
            const [totalPoints, setTotalPoints] = useState(0);
            const [gamingMinutes, setGamingMinutes] = useState(0);
            const [redemptionsToday, setRedemptionsToday] = useState(0);
            const [lastResetDate, setLastResetDate] = useState(new Date().toDateString());

            useEffect(() => {
                const savedPoints = localStorage.getItem('totalPoints');
                const savedGaming = localStorage.getItem('gamingMinutes');
                const savedLastReset = localStorage.getItem('lastResetDate');
                const savedRedemptions = localStorage.getItem('redemptionsToday');

                if (savedPoints) setTotalPoints(parseInt(savedPoints));
                if (savedGaming) setGamingMinutes(parseInt(savedGaming));
                if (savedLastReset) setLastResetDate(savedLastReset);
                if (savedRedemptions) setRedemptionsToday(parseInt(savedRedemptions));

                const today = new Date().toDateString();
                if (savedLastReset && savedLastReset !== today) {
                    resetDailyTasks();
                    localStorage.setItem('lastResetDate', today);
                    localStorage.setItem('redemptionsToday', '0');
                    setLastResetDate(today);
                    setRedemptionsToday(0);
                }
            }, []);

            useEffect(() => {
                localStorage.setItem('totalPoints', totalPoints.toString());
                localStorage.setItem('gamingMinutes', gamingMinutes.toString());
                localStorage.setItem('redemptionsToday', redemptionsToday.toString());
            }, [totalPoints, gamingMinutes, redemptionsToday]);

            useEffect(() => {
                let interval;
                if (isRunning && activeTaskId) {
                    interval = setInterval(() => {
                        setCurrentTime(prev => prev + 1);
                    }, 1000);
                }
                return () => clearInterval(interval);
            }, [isRunning, activeTaskId]);

            const resetDailyTasks = () => {
                setTasks(tasks.map(task => {
                    if (task.type === 'checkbox' || task.type === 'optional') {
                        return { ...task, completed: false, skipped: false };
                    } else if (task.type === 'timed') {
                        return { ...task, completed: false, timeSpent: 0, points: 0 };
                    } else if (task.type === 'multi') {
                        return { ...task, completed: 0 };
                    }
                    return task;
                }));
            };

            const toggleCheckbox = (taskId) => {
                setTasks(tasks.map(task => {
                    if (task.id === taskId) {
                        const newCompleted = !task.completed;
                        if (newCompleted && !task.completed) {
                            setTotalPoints(prev => prev + task.points);
                        } else if (!newCompleted && task.completed) {
                            setTotalPoints(prev => prev - task.points);
                        }
                        return { ...task, completed: newCompleted };
                    }
                    return task;
                }));
            };

            const completeOptionalTask = (taskId) => {
                setTasks(tasks.map(task => {
                    if (task.id === taskId && !task.completed && !task.skipped) {
                        setTotalPoints(prev => prev + task.points);
                        return { ...task, completed: true };
                    }
                    return task;
                }));
            };

            const skipOptionalTask = (taskId) => {
                setTasks(tasks.map(task => {
                    if (task.id === taskId && !task.completed && !task.skipped) {
                        return { ...task, skipped: true };
                    }
                    return task;
                }));
            };

            const startTimedTask = (taskId) => {
                setActiveTaskId(taskId);
                setCurrentTime(0);
                setIsRunning(true);
            };

            const pauseTask = () => {
                setIsRunning(false);
            };

            const completeTimedTask = () => {
                if (!activeTaskId) return;
                
                setTasks(tasks.map(task => {
                    if (task.id === activeTaskId) {
                        const totalTimeSpent = task.timeSpent + currentTime;
                        const earnedPoints = Math.floor(totalTimeSpent / 900);
                        const oldPoints = task.points || 0;
                        const pointsDiff = earnedPoints - oldPoints;
                        
                        if (pointsDiff > 0) {
                            setTotalPoints(prev => prev + pointsDiff);
                        }
                        
                        return { ...task, timeSpent: totalTimeSpent, points: earnedPoints, completed: true };
                    }
                    return task;
                }));
                
                setActiveTaskId(null);
                setCurrentTime(0);
                setIsRunning(false);
            };

            const completeMultiTask = (taskId) => {
                setTasks(tasks.map(task => {
                    if (task.id === taskId && task.completed < task.maxPerDay) {
                        setTotalPoints(prev => prev + task.pointsEach);
                        return { ...task, completed: task.completed + 1 };
                    }
                    return task;
                }));
            };

            const redeemGamingTime = () => {
                if (totalPoints >= 10 && redemptionsToday < 3) {
                    setTotalPoints(prev => prev - 10);
                    setGamingMinutes(prev => prev + 10);
                    setRedemptionsToday(prev => prev + 1);
                }
            };

            const resetTask = (taskId) => {
                setTasks(tasks.map(task => {
                    if (task.id === taskId) {
                        if (task.type === 'checkbox') {
                            if (task.completed) {
                                setTotalPoints(prev => prev - task.points);
                            }
                            return { ...task, completed: false };
                        } else if (task.type === 'optional') {
                            if (task.completed) {
                                setTotalPoints(prev => prev - task.points);
                            }
                            return { ...task, completed: false, skipped: false };
                        } else if (task.type === 'timed') {
                            if (task.points > 0) {
                                setTotalPoints(prev => prev - task.points);
                            }
                            return { ...task, completed: false, timeSpent: 0, points: 0 };
                        } else if (task.type === 'multi') {
                            if (task.completed > 0) {
                                setTotalPoints(prev => prev - (task.completed * task.pointsEach));
                            }
                            return { ...task, completed: 0 };
                        }
                    }
                    return task;
                }));
                
                if (activeTaskId === taskId) {
                    setActiveTaskId(null);
                    setCurrentTime(0);
                    setIsRunning(false);
                }
            };

            const formatTime = (seconds) => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            };

            const formatMinutes = (seconds) => {
                return Math.floor(seconds / 60);
            };

            const checkboxTasks = tasks.filter(t => t.type === 'checkbox');
            const optionalTasks = tasks.filter(t => t.type === 'optional');
            const timedTasks = tasks.filter(t => t.type === 'timed');
            const multiTasks = tasks.filter(t => t.type === 'multi');

            return (
                <div className="min-h-screen bg-gradient-to-br from-green-50 via-white to-green-100 p-8">
                    <div className="max-w-4xl mx-auto">
                        <div className="bg-white rounded-2xl shadow-xl p-8 mb-6 border-t-4 border-green-600">
                            <div className="flex items-center justify-between mb-6">
                                <h1 className="text-4xl font-bold text-gray-800 flex items-center gap-3">
                                    ⚽ Tagesaufgaben
                                </h1>
                                <div className="text-right">
                                    <p className="text-sm text-gray-600">Punkte</p>
                                    <p className="text-4xl font-bold text-green-600">{totalPoints}</p>
                                    <div className="flex gap-1 mt-2 justify-end">
                                        {totalPoints >= 20 && <Trophy size={20} className="text-yellow-500" />}
                                        {totalPoints >= 15 && <Trophy size={20} className="text-gray-400" />}
                                        {totalPoints >= 10 && <Trophy size={20} className="text-orange-600" />}
                                    </div>
                                </div>
                            </div>

                            {activeTaskId && (
                                <div className="bg-green-50 rounded-xl p-6 mb-6 border-2 border-green-300">
                                    <div className="flex items-center justify-between">
                                        <div>
                                            <p className="text-sm text-gray-600 mb-1">⚽ Aktuelle Aufgabe</p>
                                            <h3 className="text-2xl font-bold text-gray-800">
                                                {tasks.find(t => t.id === activeTaskId)?.name}
                                            </h3>
                                        </div>
                                        <div className="text-center">
                                            <div className="flex items-center gap-2 text-4xl font-mono font-bold text-green-600">
                                                <Clock size={32} />
                                                {formatTime(currentTime)}
                                            </div>
                                            <p className="text-sm text-gray-600 mt-1">
                                                Punkte: {Math.floor(currentTime / 900)}
                                            </p>
                                        </div>
                                    </div>
                                    <div className="flex gap-3 mt-4">
                                        {isRunning ? (
                                            <button
                                                onClick={pauseTask}
                                                className="flex-1 bg-yellow-500 text-white px-6 py-3 rounded-lg font-semibold hover:bg-yellow-600 transition flex items-center justify-center gap-2"
                                            >
                                                <Pause size={20} /> Pause
                                            </button>
                                        ) : (
                                            <button
                                                onClick={() => setIsRunning(true)}
                                                className="flex-1 bg-green-500 text-white px-6 py-3 rounded-lg font-semibold hover:bg-green-600 transition flex items-center justify-center gap-2"
                                            >
                                                <Play size={20} /> Weiter
                                            </button>
                                        )}
                                        <button
                                            onClick={completeTimedTask}
                                            className="flex-1 bg-green-700 text-white px-6 py-3 rounded-lg font-semibold hover:bg-green-800 transition flex items-center justify-center gap-2"
                                        >
                                            <CheckCircle2 size={20} /> Speichern
                                        </button>
                                    </div>
                                </div>
                            )}

                            <div className="mb-6">
                                <h2 className="text-xl font-bold text-gray-700 mb-3 flex items-center gap-2">
                                    <Calendar size={20} className="text-green-600" />
                                    Tägliche Aufgaben (1 Punkt)
                                </h2>
                                <div className="space-y-3">
                                    {checkboxTasks.map(task => (
                                        <div
                                            key={task.id}
                                            className={`p-4 rounded-xl border-2 transition ${
                                                task.completed ? 'bg-gray-50 border-gray-200' : 'bg-white border-gray-200 hover:border-green-200'
                                            }`}
                                        >
                                            <div className="flex items-center justify-between">
                                                <div className="flex items-center gap-3 flex-1">
                                                    <button
                                                        onClick={() => toggleCheckbox(task.id)}
                                                        className={`w-8 h-8 rounded border-2 flex items-center justify-center transition ${
                                                            task.completed
                                                                ? 'bg-green-500 border-green-500'
                                                                : 'border-gray-300 hover:border-green-400'
                                                        }`}
                                                    >
                                                        {task.completed && <CheckCircle2 size={20} className="text-white" />}
                                                    </button>
                                                    <h3 className={`font-semibold text-lg ${task.completed ? 'text-gray-500 line-through' : 'text-gray-800'}`}>
                                                        {task.name}
                                                    </h3>
                                                </div>
                                                {task.completed && (
                                                    <button
                                                        onClick={() => resetTask(task.id)}
                                                        className="text-gray-500 hover:text-gray-700 transition"
                                                        title="Zurücksetzen"
                                                    >
                                                        <RotateCcw size={20} />
                                                    </button>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="mb-6">
                                <h2 className="text-xl font-bold text-gray-700 mb-3 flex items-center gap-2">
                                    <Calendar size={20} className="text-blue-600" />
                                    Optional (1 Punkt oder überspringen)
                                </h2>
                                <div className="space-y-3">
                                    {optionalTasks.map(task => (
                                        <div
                                            key={task.id}
                                            className={`p-4 rounded-xl border-2 transition ${
                                                task.completed || task.skipped ? 'bg-gray-50 border-gray-200' : 'bg-white border-gray-200 hover:border-blue-200'
                                            }`}
                                        >
                                            <div className="flex items-center justify-between">
                                                <div className="flex items-center gap-3 flex-1">
                                                    {task.completed ? (
                                                        <CheckCircle2 size={24} className="text-green-500" />
                                                    ) : task.skipped ? (
                                                        <XCircle size={24} className="text-gray-400" />
                                                    ) : (
                                                        <div className="w-6 h-6 rounded-full border-2 border-gray-300" />
                                                    )}
                                                    <h3 className={`font-semibold text-lg ${
                                                        task.completed ? 'text-gray-500 line-through' : 
                                                        task.skipped ? 'text-gray-400 line-through' : 
                                                        'text-gray-800'
                                                    }`}>
                                                        {task.name}
                                                    </h3>
                                                </div>
                                                <div className="flex items-center gap-2">
                                                    {!task.completed && !task.skipped && (
                                                        <>
                                                            <button
                                                                onClick={() => completeOptionalTask(task.id)}
                                                                className="bg-green-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-green-700 transition"
                                                            >
                                                                ✓ Erledigt
                                                            </button>
                                                            <button
                                                                onClick={() => skipOptionalTask(task.id)}
                                                                className="bg-gray-400 text-white px-4 py-2 rounded-lg font-semibold hover:bg-gray-500 transition"
                                                            >
                                                                Nicht nötig
                                                            </button>
                                                        </>
                                                    )}
                                                    {(task.completed || task.skipped) && (
                                                        <button
                                                            onClick={() => resetTask(task.id)}
                                                            className="text-gray-500 hover:text-gray-700 transition"
                                                            title="Zurücksetzen"
                                                        >
                                                            <RotateCcw size={20} />
                                                        </button>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="mb-6">
                                <h2 className="text-xl font-bold text-gray-700 mb-3 flex items-center gap-2">
                                    <Clock size={20} className="text-purple-600" />
                                    Optional mit Zeit (1 Punkt pro 15 Min)
                                </h2>
                                <div className="space-y-3">
                                    {timedTasks.map(task => (
                                        <div
                                            key={task.id}
                                            className={`p-4 rounded-xl border-2 transition ${
                                                activeTaskId === task.id
                                                    ? 'bg-purple-50 border-purple-300'
                                                    : 'bg-white border-gray-200 hover:border-purple-200'
                                            }`}
                                        >
                                            <div className="flex items-center justify-between">
                                                <div className="flex items-center gap-3 flex-1">
                                                    <Clock size={24} className="text-purple-600" />
                                                    <div>
                                                        <h3 className="font-semibold text-lg text-gray-800">{task.name}</h3>
                                                        <p className="text-sm text-gray-600">
                                                            {task.timeSpent > 0 && `Bisher: ${formatMinutes(task.timeSpent)} Min | `}
                                                            Punkte: {task.points}
                                                        </p>
                                                    </div>
                                                </div>
                                                <div className="flex items-center gap-2">
                                                    {activeTaskId !== task.id && (
                                                        <button
                                                            onClick={() => startTimedTask(task.id)}
                                                            disabled={activeTaskId !== null}
                                                            className="bg-purple-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-purple-700 transition disabled:bg-gray-300 disabled:cursor-not-allowed flex items-center gap-2"
                                                        >
                                                            <Play size={16} /> Start
                                                        </button>
                                                    )}
                                                    {task.timeSpent > 0 && (
                                                        <button
                                                            onClick={() => resetTask(task.id)}
                                                            className="text-gray-500 hover:text-gray-700 transition"
                                                            title="Zurücksetzen"
                                                        >
                                                            <RotateCcw size={20} />
                                                        </button>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="mb-6">
                                <h2 className="text-xl font-bold text-gray-700 mb-3 flex items-center gap-2">
                                    <Calendar size={20} className="text-cyan-600" />
                                    Mehrmals täglich (0.5 Punkte pro Mal)
                                </h2>
                                <div className="space-y-3">
                                    {multiTasks.map(task => (
                                        <div
                                            key={task.id}
                                            className="p-4 rounded-xl border-2 bg-white border-gray-200 hover:border-cyan-200 transition"
                                        >
                                            <div className="flex items-center justify-between">
                                                <div className="flex items-center gap-3 flex-1">
                                                    <div className="text-cyan-600 font-bold text-lg">
                                                        {task.completed}/{task.maxPerDay}
                                                    </div>
                                                    <h3 className="font-semibold text-lg text-gray-800">{task.name}</h3>
                                                </div>
                                                <div className="flex items-center gap-2">
                                                    <button
                                                        onClick={() => completeMultiTask(task.id)}
                                                        disabled={task.completed >= task.maxPerDay}
                                                        className="bg-cyan-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-cyan-700 transition disabled:bg-gray-300 disabled:cursor-not-allowed"
                                                    >
                                                        + Erledigt
                                                    </button>
                                                    {task.completed > 0 && (
                                                        <button
                                                            onClick={() => resetTask(task.id)}
                                                            className="text-gray-500 hover:text-gray-700 transition"
                                                            title="Zurücksetzen"
                                                        >
                                                            <RotateCcw size={20} />
                                                        </button>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        <div className="bg-gradient-to-r from-purple-500 to-indigo-600 rounded-2xl shadow-xl p-6 mb-6 text-white">
                            <div className="flex items-center justify-between mb-4">
                                <div>
                                    <h2 className="text-2xl font-bold flex items-center gap-2">
                                        <Gamepad2 size={28} />
                                        Gaming-Zeit
                                    </h2>
                                    <p className="text-purple-100 text-sm mt-1">
                                        {redemptionsToday}/3 Einlösungen heute | 10 Punkte = 10 Minuten
                                    </p>
                                </div>
                                <div className="text-right">
                                    <p className="text-purple-100 text-sm">Verfügbare Zeit</p>
                                    <p className="text-4xl font-bold">{gamingMinutes} min</p>
                                </div>
                            </div>
                            
                            <div className="bg-white bg-opacity-20 backdrop-blur-sm rounded-xl p-4">
                                <button
                                    onClick={redeemGamingTime}
                                    disabled={totalPoints < 10 || redemptionsToday >= 3}
                                    className="w-full bg-white text-purple-600 px-6 py-3 rounded-lg font-bold text-lg hover:bg-purple-50 transition disabled:opacity-50 disabled:cursor-not-allowed"
                                >
                                    {redemptionsToday >= 3 
                                        ? '❌ Maximale Einlösungen erreicht' 
                                        : totalPoints < 10 
                                        ? '🔒 Nicht genug Punkte' 
                                        : '🎮 10 Punkte → 10 Minuten Gaming'}
                                </button>
                            </div>
                        </div>

                        <div className="bg-white rounded-xl shadow-lg p-6 border-l-4 border-green-600">
                            <h2 className="text-xl font-bold text-gray-800 mb-3 flex items-center gap-2">
                                <Trophy size={24} className="text-yellow-500" />
                                Punktesystem
                            </h2>
                            <div className="space-y-2 text-sm text-gray-700">
                                <p>✓ <strong>Tägliche Aufgaben:</strong> 1 Punkt pro Aufgabe</p>
                                <p>📚 <strong>Optionale Aufgaben:</strong> 1 Punkt wenn erledigt</p>
                                <p>⏱️ <strong>Zeit-Aufgaben:</strong> 1 Punkt pro 15 Minuten</p>
                                <p>💧 <strong>Mehrmals täglich:</strong> 0.5 Punkte pro Durchführung</p>
                                <p>🎮 <strong>Gaming-Zeit:</strong> 10 Punkte = 10 Minuten (max. 3x täglich)</p>
                            </div>
                            <div className="mt-4 pt-4 border-t border-gray-200">
                                <p className="text-sm text-gray-600">
                                    💡 <strong>Hinweis:</strong> Alle Aufgaben werden täglich um Mitternacht zurückgesetzt. Deine Punkte und Gaming-Zeit bleiben erhalten!
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<TaskDashboard />, document.getElementById('root'));
    </script>
</body>
</html>
